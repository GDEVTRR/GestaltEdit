
name: GestaltEdit iOS Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gestaltedit-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build GestaltEdit
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Detect project
        id: project
        run: |
          if [ -d "GestaltEdit.xcodeproj" ]; then
            echo "path=GestaltEdit.xcodeproj" >> "$GITHUB_OUTPUT"
          elif [ -d "GestaltEdit.xcworkspace" ]; then
            echo "path=GestaltEdit.xcworkspace" >> "$GITHUB_OUTPUT"
          else
            echo "No Xcode project or workspace found."
            exit 1
          fi

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project GestaltEdit.xcodeproj \
            -scheme GestaltEdit \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
