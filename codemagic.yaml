
workflows:
  gestaltedit-ios:
    name: GestaltEdit iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Check Xcode
        script: |
          xcodebuild -version

      - name: Build GestaltEdit
        script: |
          set -o pipefail
          xcodebuild \
            -project "$CM_BUILD_DIR/GestaltEdit.xcodeproj" \
            -scheme GestaltEdit \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$CM_BUILD_DIR/xcodebuild.log"

          echo "========== SWIFT ERRORS =========="
          grep -n -B 5 -A 12 "error:" "$CM_BUILD_DIR/xcodebuild.log" || true

    artifacts:
      - xcodebuild.log
