
workflows:
  gestaltedit-ios:
    name: GestaltEdit iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Check Xcode
        script: |
          xcodebuild -version

      - name: List project schemes
        script: |
          xcodebuild -list -project "$CM_BUILD_DIR/GestaltEdit.xcodeproj"

      - name: Build GestaltEdit
        script: |
          xcodebuild \
            -project "$CM_BUILD_DIR/GestaltEdit.xcodeproj" \
            -scheme GestaltEdit \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - build/DerivedData/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log
