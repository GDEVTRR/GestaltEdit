
workflows:
  gestaltedit-ios:
    name: GestaltEdit Unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Check Xcode
        script: |
          xcodebuild -version

      - name: Archive GestaltEdit
        script: |
          set -o pipefail

          xcodebuild archive \
            -project "$CM_BUILD_DIR/GestaltEdit.xcodeproj" \
            -scheme GestaltEdit \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/build/GestaltEdit.xcarchive" \
            CODE_SIGNING_ALLOWED=NO

      - name: Create Unsigned IPA
        script: |
          set -e

          APP="$CM_BUILD_DIR/build/GestaltEdit.xcarchive/Products/Applications/GestaltEdit.app"
          IPA_DIR="$CM_BUILD_DIR/build/ipa"

          if [ ! -d "$APP" ]; then
            echo "ERROR: GestaltEdit.app bulunamadi!"
            exit 1
          fi

          mkdir -p "$IPA_DIR/Payload"

          cp -R "$APP" "$IPA_DIR/Payload/GestaltEdit.app"

          cd "$IPA_DIR"

          zip -r GestaltEdit.ipa Payload

          echo "IPA CREATED:"
          ls -lh GestaltEdit.ipa

    artifacts:
      - build/ipa/*.ipa
      - build/GestaltEdit.xcarchive
