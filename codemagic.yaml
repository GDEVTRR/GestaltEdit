
workflows:
  gestaltedit-ios:
    name: GestaltEdit IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Archive iOS App
        script: |
          set -o pipefail

          xcodebuild archive \
            -project "$CM_BUILD_DIR/GestaltEdit.xcodeproj" \
            -scheme GestaltEdit \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/build/GestaltEdit.xcarchive" \
            CODE_SIGNING_ALLOWED=NO

      - name: Export IPA
        script: |
          mkdir -p "$CM_BUILD_DIR/build/ipa"

          cat > "$CM_BUILD_DIR/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>debugging</string>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/GestaltEdit.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ipa" \
            -exportOptionsPlist "$CM_BUILD_DIR/ExportOptions.plist"

    artifacts:
      - build/ipa/*.ipa
      - build/GestaltEdit.xcarchive
